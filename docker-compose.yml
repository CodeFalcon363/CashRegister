services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: cashregister-sqlserver
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=${DB_PASSWORD}
      - MSSQL_PID=Developer
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - cashregister-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P ${DB_PASSWORD} -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: cashregister-webapp
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - DB_SERVER=sqlserver
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - WEBAPP_PORT=8080
    ports:
      - "${WEBAPP_PORT:-5200}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - cashregister-network

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: cashregister-api
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - DB_SERVER=sqlserver
      - DB_NAME=${DB_NAME}
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - JWT_ISSUER=${JWT_ISSUER}
      - JWT_AUDIENCE=${JWT_AUDIENCE}
      - JWT_EXPIRY_MINUTES=${JWT_EXPIRY_MINUTES}
      - API_PORT=8080
    ports:
      - "${API_PORT:-5100}:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
    networks:
      - cashregister-network

volumes:
  sqlserver-data:

networks:
  cashregister-network:
    driver: bridge
